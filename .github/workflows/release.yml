name: Build extension

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set release version
        run: |
          bun - <<'JS'
          import { appendFileSync } from 'node:fs';
          const pkg = await Bun.file('package.json').json();
          const version = (process.env.RELEASE_TAG || pkg.version).replace(/^v/, '');
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)
              || version.split('.').some(part => Number(part) > 65535)
              || version === '0.0.0') {
            throw Error('Use a release tag like v0.2.0 (three numbers from 0 to 65535).');
          }
          await Bun.write('package.json', JSON.stringify({ ...pkg, version }, null, 2) + '\n');
          appendFileSync(process.env.GITHUB_ENV, `PI2_VERSION=${version}\n`);
          JS

      - name: Check types and unit tests
        run: bun run check

      - name: Lint
        run: bun run lint

      - name: Build Chromium and Firefox ZIPs
        run: |
          bun run zip
          bun run zip:firefox

      - name: Verify ZIP
        run: |
          unzip -t ".output/pi2-${PI2_VERSION}-chrome.zip"
          unzip -t ".output/pi2-${PI2_VERSION}-firefox.zip"
          bun - <<'JS'
          for (const browser of ['chrome', 'firefox']) {
            const manifest = await Bun.file(`.output/${browser}-mv3/manifest.json`).json();
            if (manifest.version !== process.env.PI2_VERSION) throw Error(`Incorrect ${browser} version.`);
          }
          JS

      - name: Keep downloadable build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pi2-${{ env.PI2_VERSION }}
          path: |
            .output/pi2-${{ env.PI2_VERSION }}-chrome.zip
            .output/pi2-${{ env.PI2_VERSION }}-firefox.zip
          if-no-files-found: error
          retention-days: 14

      - name: Attach ZIP to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" ".output/pi2-${PI2_VERSION}-chrome.zip" ".output/pi2-${PI2_VERSION}-firefox.zip" --clobber
